      - title: "Rice Engineering Student Awards & Scholarships"
        sponsor: "Rice University"
        url: "https://engineering.rice.edu/academics/student-awards-scholarships"
        scope: "Institutional"
        tags: [engineering, texas, rice_students]
      - title: "UH Cullen College of Engineering Scholarships"
