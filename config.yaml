compliance:
  user_agent: "ScholarOS-IngestBot/1.0 (+personal-noncommercial-academic-tracker)"
  min_delay_seconds: 2.5
  max_delay_seconds: 5.0
  timeout_seconds: 20
  respect_robots_txt: true
  abort_on_status_codes: [403, 429]

sources:
  # Curated primary-source pages. Each was checked (2026-11-24): robots.txt allows the page AND the site's
  # Terms of Use contain no clause against automated access (or the site has no terms). Full audit with
  # every verdict and reason: docs/SOURCES.md. Re-check terms before adding a page: scripts/check_source.py.
  watchlist:
    enabled: true
    pages:
      - title: "SWE Scholarships"
        sponsor: "Society of Women Engineers"
        url: "https://swe.org/scholarships-overview/"
        tags: [engineering, undergraduate]
      - title: "Vertical Flight Foundation Scholarships"
        sponsor: "Vertical Flight Society"
        url: "https://vtol.org/benefits-and-resources/education-and-student-activities/vff-scholarships"
        award: "$4,000 - $6,000"
        tags: [aerospace_engineering, undergraduate, merit]
      - title: "ScholarSHPE"
        sponsor: "Society of Hispanic Professional Engineers"
        url: "https://shpe.org/engage/programs/scholarshpe/"
        tags: [engineering, stem, undergraduate]
      - title: "Texas Space Grant Consortium Scholarships & Fellowships"
        sponsor: "Texas Space Grant Consortium"
        url: "https://ig.utexas.edu/tsgc/"
        scope: "State"
        tags: [aerospace_engineering, texas, undergraduate]
      - title: "Women in Aviation International Scholarships"
        sponsor: "Women in Aviation International"
        url: "https://www.wai.org/scholarships"
        tags: [aviation, aerospace_engineering]
      - title: "Brooke Owens Fellowship"
        sponsor: "Brooke Owens Fellowship"
        url: "https://brookeowensfellowship.org/apply"
        tags: [aerospace_engineering, fellowship, internship, women]
      - title: "AOPA Flight Training Scholarships"
        sponsor: "AOPA Foundation"
        url: "https://www.aopa.org/training-and-safety/students/aopa-flight-training-scholarships"
        award: "$250 - $14,000"
        tags: [aviation, flight_training]
        # Off 2026-11-24: aopa.org/terms-of-use bans copying/reproducing "any information ... obtained from the AOPA
        # Websites" (same category as ASME/AIAA). Re-enable only with written permission. See docs/SOURCES.md.
        enabled: false
      - title: "EAA Flight Training Scholarships"
        sponsor: "Experimental Aircraft Association"
        url: "https://www.eaa.org/eaa/learn-to-fly/Scholarships"
        tags: [aviation, flight_training]
      - title: "Ninety-Nines Scholarships"
        sponsor: "The Ninety-Nines"
        url: "https://ninety-nines.org/scholarships/"
        tags: [aviation, women]
      - title: "Air & Space Forces Association Scholarships"
        sponsor: "Air & Space Forces Association"
        url: "https://www.afa.org/scholarships/"
        tags: [aerospace_engineering, stem, undergraduate]
      - title: "Order of Daedalians Scholarships"
        sponsor: "Order of Daedalians"
        url: "https://www.daedalians.org/scholarships/"
        award: "$1,000 - $3,000"
        tags: [aviation, military_aviation]
      - title: "AEA Educational Foundation Scholarships"
        sponsor: "Aircraft Electronics Association"
        url: "https://www.aea.net/educationalfoundation/scholarships.asp"
        award: "$1,000 - $5,000"
        tags: [aviation, avionics, undergraduate]
      - title: "AMAC Foundation Scholarships"
        sponsor: "Airport Minority Advisory Council"
        url: "https://www.amac-org.com/scholarships-archive/"
        tags: [aviation, minority]
      - title: "Udall Undergraduate Scholarship"
        sponsor: "Udall Foundation"
        url: "https://www.udall.gov/OurPrograms/Scholarship/Scholarship"
        award: "$7,500"
        tags: [environment, undergraduate]
      - title: "ASCE Scholarships"
        sponsor: "American Society of Civil Engineers"
        url: "https://www.asce.org/career-growth/awards-and-honors/scholarships"
        award: "$2,500 - $5,000"
        tags: [civil_engineering, undergraduate, asce_members]
      - title: "Tau Beta Pi Scholarships"
        sponsor: "Tau Beta Pi"
        url: "https://www.tbp.org/scholarships.cfm"
        award: "$1,000 - $2,000"
        tags: [engineering, honor_society_members]
      - title: "SFTE Barbara Wood Scholarship"
        sponsor: "Society of Flight Test Engineers"
        url: "https://www.sfte.org/barbara_wood_scholarship.php"
        tags: [aerospace_engineering, flight_test]
      - title: "AISES Scholarships"
        sponsor: "American Indian Science and Engineering Society"
        url: "https://aises.org/scholarships/"
        award: "$1,000 - $6,500"
        tags: [stem, native_american, undergraduate]
      - title: "SASE Scholarship"
        sponsor: "Society of Asian Scientists and Engineers"
        url: "https://main.saseconnect.org/scholarship"
        award: "$5,000"
        tags: [stem, asian_american, undergraduate]
      - title: "NSPE Education Foundation Scholarships"
        sponsor: "National Society of Professional Engineers"
        url: "https://www.nspe.org/resources/education-foundation"
        tags: [engineering, undergraduate]
      - title: "SME Education Foundation Scholarships"
        sponsor: "SME Education Foundation"
        url: "https://scholarships.smeef.org/applications/"
        award: "$2,500 - $20,000"
        tags: [manufacturing_engineering, engineering, undergraduate]
      - title: "Texas A&M Aerospace Engineering Scholarships"
        sponsor: "Texas A&M University"
        url: "https://engineering.tamu.edu/aerospace/advising/scholarships-and-aid/index.html"
        scope: "Institutional"
        tags: [aerospace_engineering, texas, tamu_students]
      - title: "Texas Tech Engineering Scholarships"
        sponsor: "Texas Tech University"
        url: "https://www.depts.ttu.edu/coe/undergraduate/scholarships.php"
        scope: "Institutional"
        tags: [engineering, texas, ttu_students]
      - title: "Rice Engineering Student Awards & Scholarships"
        sponsor: "Rice University"
        url: "https://engineering.rice.edu/academics/student-awards-scholarships"
        scope: "Institutional"
        tags: [engineering, texas, rice_students]
      - title: "UH Cullen College of Engineering Scholarships"
        sponsor: "University of Houston"
        url: "https://www.egr.uh.edu/academics/scholarships"
        scope: "Institutional"
        tags: [engineering, texas, uh_students]
      - title: "Texas State Financial Aid Programs"
        sponsor: "Texas Higher Education Coordinating Board"
        url: "https://www.highered.texas.gov/state-financial-aid/"
        scope: "State"
        tags: [texas, state_aid]
      # Round 2 (2026-11-24, check_source.py --terms): IISE terms are a disclaimer only; OBAP and NBAA have no
      # terms page (privacy policy only, no access clause).
      - title: "IISE Scholarships and Fellowships"
        sponsor: "Institute of Industrial and Systems Engineers"
        url: "https://www.iise.org/details.aspx?id=857"
        award: "Up to $5,000"
        tags: [industrial_engineering, engineering, membership_required]
      - title: "OBAP Scholarships"
        sponsor: "Organization of Black Aerospace Professionals"
        url: "https://obap.org/scholarships/"
        tags: [aviation, aerospace_engineering, black_students, membership_required]
      - title: "NBAA Scholarships"
        sponsor: "National Business Aviation Association"
        url: "https://www.nbaa.org/professional-development/scholarships/"
        tags: [aviation, business_aviation]
      # Round 3 (2026-11-24): AWS terms (43k chars) have no access/copy clause; UNT disclaimer has none either.
      - title: "AWS Foundation Welding Scholarships"
        sponsor: "American Welding Society Foundation"
        url: "https://www.aws.org/scholarships"
        tags: [welding, welding_engineering, engineering]
      - title: "UNT College of Engineering Scholarships"
        sponsor: "University of North Texas"
        url: "https://engineering.unt.edu/support/scholarships"
        scope: "Institutional"
        tags: [engineering, texas, unt_students]
  # CareerOneStop is not accepting new API registrations (as of 2026-11); skips itself without credentials.
  careeronestop:
    enabled: true
    keywords:
      - "aerospace engineering"
      - "engineering undergraduate"
      - "STEM merit"
      - "Texas undergraduate"
    study_level: "Bachelor's"
    max_results_per_keyword: 25
  # Aggregators below are DISABLED: Unigo's Terms of Use forbid "any automatic device, process or means"
  # to access or copy the site; Bold.org (Vercel bot checkpoint, HTTP 429) and Niche (HTTP 403) actively block bots.
  # Do not re-enable or add headless-browser workarounds without written permission from the site.
  bold:
    enabled: false
    public_listing_urls:
      - "https://bold.org/scholarships/by-major/engineering-scholarships/"
      - "https://bold.org/scholarships/by-year/college/undergraduate-scholarships/"
    max_items_per_url: 20
  unigo:
    enabled: false
    public_listing_urls:
      - "https://www.unigo.com/scholarships/by-major/engineering-scholarships"
      - "https://www.unigo.com/scholarships/by-state/texas-scholarships"
    max_items_per_url: 20
  niche:
    enabled: false
    public_listing_urls:
      - "https://www.niche.com/colleges/scholarships/?major=engineering"
    max_items_per_url: 20

filters:
  reject_keywords:
    - "no essay"
    - "sweepstakes"
    - "random drawing"
    - "application fee"
    - "pell grant required"
    - "demonstrated financial need required"
    - "financial need only"
    - "graduate students only"
    - "phd only"
    - "doctoral only"
    - "high school seniors only"
    - "daca only"
    - "veterans only"
    - "military dependents only"
  min_award_usd: 500
  require_future_deadline: true

sheets:
  staging_tab: "Ingest_Staging"
  catalog_tab: "Catalog_Scholarships"
