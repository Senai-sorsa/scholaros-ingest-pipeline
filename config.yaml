        tags: [aviation, business_aviation]
      # Round 3 (2026-11-24): AWS terms (43k chars) have no access/copy clause; UNT disclaimer has none either.
      - title: "AWS Foundation Welding Scholarships"
        sponsor: "American Welding Society Foundation"
